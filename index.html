<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُزيل الخلفية الخضراء الاحترافي | SZ Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(23, 25, 35, 0.75);
            --border-color: rgba(138, 43, 226, 0.3);
            --primary-purple: #8a2be2;
            --accent-glow: #9d4edd;
            --text-main: #ffffff;
            --text-sub: #c4c4c4;
            --success-green: #00f081;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(157, 78, 221, 0.15) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(138, 43, 226, 0.2);
            text-align: center;
            position: relative;
        }

        .header {
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, #c4c4c4 50%, var(--accent-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-sub);
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .upload-section {
            margin-bottom: 30px;
        }

        .file-input {
            display: none;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 36px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, var(--primary-purple), #5a189a);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(138, 43, 226, 0.4);
            text-decoration: none;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(157, 78, 221, 0.6);
            background: linear-gradient(135deg, #9d4edd, #7b2cbf);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-convert {
            background: linear-gradient(135deg, #8a2be2, #4c1d95);
            box-shadow: 0 8px 25px rgba(138, 43, 226, 0.4);
            margin-top: 20px;
        }

        .preview-container {
            display: none;
            margin-top: 30px;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .canvas-wrapper {
            position: relative;
            max-width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background-color: #1a1a24;
            background-image: 
                linear-gradient(45deg, #252533 25%, transparent 25%), 
                linear-gradient(-45deg, #252533 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #252533 75%), 
                linear-gradient(-45deg, transparent 75%, #252533 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
            width: 150px;
            height: 150px;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        video {
            display: none;
        }

        .controls-panel {
            display: none;
            width: 100%;
            max-width: 500px;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 15px;
        }

        .control-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.95rem;
            color: var(--text-sub);
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        input[type=range] {
            width: 60%;
            accent-color: var(--primary-purple);
            cursor: pointer;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            background: rgba(138, 43, 226, 0.15);
            color: var(--accent-glow);
            border: 1px solid rgba(138, 43, 226, 0.3);
            margin-bottom: 20px;
        }

        .footer-tag {
            margin-top: 30px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-badge">SZ GREEN SCREEN REMOVER v2.0</div>
        
        <div class="header">
            <h1>أهلاً بك في أداة إزالة الخلفية الخضراء الاحترافية 👋</h1>
            <p>قم برفع الفيديو لإزالة الخلفية الخضراء وتحويله مباشرة إلى GIF بأعلى دقة وأبعاد 100x100.</p>
        </div>

        <div class="upload-section">
            <input type="file" id="videoInput" class="file-input" accept="video/*">
            <button class="btn" onclick="document.getElementById('videoInput').click()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                رفع الفيديو
            </button>
        </div>

        <video id="sourceVideo" playsinline loop muted></video>

        <div class="preview-container" id="previewContainer">
            <div class="canvas-wrapper">
                <canvas id="outputCanvas" width="100" height="100"></canvas>
            </div>

            <div class="controls-panel" id="controlsPanel">
                <div class="control-group">
                    <label for="tolerance">حساسية اللون الأخضر:</label>
                    <input type="range" id="tolerance" min="0" max="150" value="70">
                </div>
                <div class="control-group">
                    <label for="smoothness">نعومة الحواف:</label>
                    <input type="range" id="smoothness" min="0" max="50" value="15">
                </div>
            </div>

            <button class="btn btn-convert" id="convertBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                تحويل (GIF بحجم 100x100)
            </button>
        </div>

        <div class="footer-tag">تصميم وتطوير احترافي بواسطة SZ Studio</div>
    </div>

    <script>
        const videoInput = document.getElementById('videoInput');
        const sourceVideo = document.getElementById('sourceVideo');
        const outputCanvas = document.getElementById('outputCanvas');
        const ctx = outputCanvas.getContext('2d', { willReadFrequently: true });
        const previewContainer = document.getElementById('previewContainer');
        const controlsPanel = document.getElementById('controlsPanel');
        const convertBtn = document.getElementById('convertBtn');
        const toleranceInput = document.getElementById('tolerance');
        const smoothnessInput = document.getElementById('smoothness');

        let mediaRecorder;
        let recordedChunks = [];

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        videoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                sourceVideo.src = fileURL;
                sourceVideo.load();
                sourceVideo.play();

                previewContainer.style.display = 'flex';
                controlsPanel.style.display = 'block';
            }
        });

        sourceVideo.addEventListener('loadedmetadata', function() {
            requestAnimationFrame(processFrame);
        });

        function processFrame() {
            if (sourceVideo.paused || sourceVideo.ended) {
                requestAnimationFrame(processFrame);
                return;
            }

            let vw = sourceVideo.videoWidth;
            let vh = sourceVideo.videoHeight;
            let minDim = Math.min(vw, vh);
            let sx = (vw - minDim) / 2;
            let sy = (vh - minDim) / 2;

            ctx.clearRect(0, 0, 100, 100);
            ctx.drawImage(sourceVideo, sx, sy, minDim, minDim, 0, 0, 100, 100);

            let frame = ctx.getImageData(0, 0, 100, 100);
            let l = frame.data.length / 4;

            let tolerance = parseInt(toleranceInput.value);
            let smoothness = parseInt(smoothnessInput.value);

            for (let i = 0; i < l; i++) {
                let r = frame.data[i * 4 + 0];
                let g = frame.data[i * 4 + 1];
                let b = frame.data[i * 4 + 2];

                if (g > 70 && g > r * 1.1 && g > b * 1.1) {
                    let diff = g - Math.max(r, b);
                    if (diff > (150 - tolerance)) {
                        let alpha = 255 - ((diff - (150 - tolerance)) * (255 / (smoothness + 1)));
                        frame.data[i * 4 + 3] = Math.max(0, Math.min(255, alpha));
                    }
                }
            }

            ctx.putImageData(frame, 0, 0);
            requestAnimationFrame(processFrame);
        }

        // تحويل وتصدير الملف بصيغة GIF وبأعلى معدل بت ودقة ممكنة
        convertBtn.addEventListener('click', function() {
            recordedChunks = [];
            const stream = outputCanvas.captureStream(30);
            const options = { 
                videoBitsPerSecond: 8000000 // معدل بت عالٍ جداً للحفاظ على جودة الإطارات بالكامل
            };

            try {
                mediaRecorder = new MediaRecorder(stream, options);
            } catch (e) {
                mediaRecorder = new MediaRecorder(stream);
            }

            mediaRecorder.ondataavailable = function(e) {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = function() {
                const blob = new Blob(recordedChunks, { type: 'image/gif' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'result_100x100_SZ.gif';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 100);

                convertBtn.innerText = "تحويل (GIF بحجم 100x100)";
                convertBtn.disabled = false;
            };

            convertBtn.innerText = "جاري تحضير وتصدير الـ GIF...";
            convertBtn.disabled = true;

            sourceVideo.currentTime = 0;
            mediaRecorder.start();

            setTimeout(() => {
                if(mediaRecorder.state === "recording") mediaRecorder.stop();
            }, (sourceVideo.duration * 1000) || 3000);
        });
    </script>
</body>
</html>
