<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SZ Script Encryptor & Obfuscator</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-color: #ef4444;
            --accent-hover: #dc2626;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
            --code-bg: #030712;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(239, 68, 68, 0.08) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.05) 0%, transparent 25%);
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ef4444, #3b82f6, #ef4444);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header h1 span {
            color: var(--accent-color);
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 5px;
        }

        .badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin-top: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
        }

        textarea {
            width: 100%;
            height: 220px;
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            color: #38bdf8;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
            direction: ltr;
            text-align: left;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        .btn {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-box {
            margin-top: 25px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .result-header label {
            font-weight: 600;
            font-size: 14px;
            color: var(--success);
        }

        .output-wrapper {
            position: relative;
        }

        .output-code {
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 10px;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            color: #a7f3d0;
            word-break: break-all;
            direction: ltr;
            text-align: left;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--success);
            color: #000;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>SZ <span>Script Encryptor</span></h1>
            <p>نظام التشفير الحصري والرفع التلقائي المباشر</p>
            <span class="badge">محمي بواسطة SZ System</span>
        </div>

        <div class="form-group">
            <label for="scriptInput">ضع السكربت الأصلي الخاص بك هنا (Lua Code):</label>
            <textarea id="scriptInput" placeholder="-- ضع كود اللوا الخاص بك هنا&#10;print('Hello World!')"></textarea>
        </div>

        <button class="btn" id="encryptBtn" onclick="processAndUpload()">
            <div class="spinner" id="btnSpinner"></div>
            <span id="btnText">🔒 تشفير السكربت والرفع الفوري</span>
        </button>

        <div class="result-box" id="resultBox">
            <div class="result-header">
                <label>✅ تم الرفع والتشفير بنجاح (تم النسخ تلقائياً للجهاز):</label>
            </div>
            <div class="output-wrapper">
                <div class="output-code" id="outputCode"></div>
            </div>
        </div>

        <div class="footer">
            جميع الحقوق محفوظة &copy; SZ Security System | Encrypt X
        </div>
    </div>

    <div class="toast" id="toast">📋 تم نسخ كود loadstring إلى جهازك تلقائياً!</div>

    <script>
        const FIREBASE_URL = "https://sz-chat-1306e-default-rtdb.firebaseio.com/scripts";

        function generateUniqueId() {
            return Math.floor(1000000000000 + Math.random() * 9000000000000).toString();
        }

        async function processAndUpload() {
            const rawScript = document.getElementById('scriptInput').value.trim();
            const btn = document.getElementById('encryptBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');
            const resultBox = document.getElementById('resultBox');
            const outputCode = document.getElementById('outputCode');

            if (!rawScript) {
                alert("يرجى كتابة السكربت أولاً!");
                return;
            }

            // UI Loading state
            btn.disabled = true;
            spinner.style.display = 'block';
            btnText.innerText = 'جاري التشفير والرفع...';

            const scriptId = generateUniqueId();
            const securityHash = "SZ_" + Math.random().toString(36).substring(2, 10).toUpperCase();

            // Structure data to be uploaded
            const payload = {
                script: rawScript,
                protection: "Protected by SZ Security System",
                provider: "Encrypt X Access",
                site: "https://encrypt-x.pages.dev",
                hash: securityHash,
                timestamp: Date.now()
            };

            try {
                // Upload to Firebase Realtime Database
                const response = await fetch(`${FIREBASE_URL}/${scriptId}.json`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error("فشل الرفع إلى السيرفر");
                }

                // Generate loadstring code
                const loadstringCode = `loadstring(game:HttpGet("https://encrypt-x.pages.dev/Scripts?Id=${scriptId}"))("${scriptId}")`;

                outputCode.innerText = loadstringCode;
                resultBox.style.display = 'block';

                // Copy directly to clipboard
                await navigator.clipboard.writeText(loadstringCode);
                showToast();

            } catch (error) {
                alert("حدث خطأ أثناء الاتصال بالسيرفر: " + error.message);
            } finally {
                // Restore button state
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.innerText = '🔒 تشفير السكربت والرفع الفوري';
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }
    </script>
</body>
</html>
