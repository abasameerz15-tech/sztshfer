<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SZ Script Encrypter 🔐</title>
    <!-- Firebase App (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(145deg, #0b0b0b, #1a1a1a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #eee;
        }
        .container {
            background: #1a1a1a;
            border-radius: 28px;
            padding: 40px 30px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 1px solid #2e2e2e;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #f5f5f5;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        h1 span { color: #8ab4f8; }
        .sub {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
        }
        textarea {
            width: 100%;
            min-height: 220px;
            background: #252525;
            border: 1px solid #3a3a3a;
            border-radius: 14px;
            padding: 16px;
            color: #e0e0e0;
            font-size: 15px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            outline: none;
            transition: 0.25s;
            line-height: 1.7;
        }
        textarea:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,0.15); }
        textarea::placeholder { color: #666; font-family: 'Segoe UI', sans-serif; }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 18px 0 12px;
        }
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
            justify-content: center;
        }
        .btn-primary { background: #1a73e8; color: #fff; box-shadow: 0 4px 14px rgba(26,115,232,0.25); }
        .btn-primary:hover { background: #1557b0; transform: scale(1.02); }
        .btn-success { background: #0f9d58; color: #fff; box-shadow: 0 4px 14px rgba(15,157,88,0.25); }
        .btn-success:hover { background: #0b7a45; transform: scale(1.02); }
        .btn-danger { background: #d93025; color: #fff; }
        .btn-danger:hover { background: #b3261e; }
        .btn-secondary { background: #333; color: #ddd; border: 1px solid #555; }
        .btn-secondary:hover { background: #444; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .output-box {
            background: #222;
            border-radius: 14px;
            padding: 16px 18px;
            border: 1px solid #3a3a3a;
            margin-top: 18px;
            word-break: break-all;
        }
        .output-box .label {
            color: #aaa;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
        }
        .output-box .code {
            background: #1a1a1a;
            padding: 12px 14px;
            border-radius: 10px;
            color: #81c995;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            user-select: all;
            overflow-x: auto;
            border: 1px solid #2a2a2a;
            direction: ltr;
            text-align: left;
        }
        .copy-btn {
            background: transparent;
            border: none;
            color: #8ab4f8;
            cursor: pointer;
            font-size: 13px;
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .copy-btn:hover { text-decoration: underline; }
        .status {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }
        .status.success { display: block; background: #1a2a1a; color: #81c995; border: 1px solid #2a5a3a; }
        .status.error { display: block; background: #2a1a1a; color: #f28b82; border: 1px solid #5a2a2a; }
        .status.info { display: block; background: #1a1a2a; color: #8ab4f8; border: 1px solid #2a3a5a; }
        .link-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-top: 6px;
        }
        .link-row a {
            color: #8ab4f8;
            word-break: break-all;
            font-size: 14px;
        }
        .badge {
            display: inline-block;
            background: #1a73e8;
            color: #fff;
            font-size: 11px;
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 600;
        }
        .footer { margin-top: 25px; text-align: center; color: #666; font-size: 13px; }
        .footer a { color: #8ab4f8; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        @media (max-width: 480px) {
            .container { padding: 25px 18px; }
            .btn { font-size: 14px; padding: 12px 18px; }
            textarea { min-height: 160px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔐 SZ <span>Encrypter</span></h1>
    <p class="sub">أكتب سكربت Lua ثم اضغط زر التشفير لرفعه وحمايته</p>

    <textarea id="scriptInput" placeholder="-- أكتب سكربت Lua هنا ...&#10;print('Hello SZ!')"></textarea>

    <div class="btn-group">
        <button class="btn btn-primary" id="encryptBtn">🚀 تشفير ورفع</button>
        <button class="btn btn-secondary" id="clearBtn">🗑️ مسح</button>
    </div>

    <div id="status" class="status"></div>

    <div id="resultArea" style="display: none;">
        <div class="output-box">
            <span class="label">📋 سكربت Roblox جاهز للنسخ (loadstring)</span>
            <div class="code" id="robloxScript">-- سيظهر هنا بعد الرفع</div>
            <button class="copy-btn" id="copyRobloxBtn">📋 نسخ السكربت</button>
        </div>

        <div class="output-box">
            <span class="label">🔗 رابط العرض (يظهر رسالة التشفير)</span>
            <div class="link-row">
                <a href="#" id="viewLink" target="_blank">اضغط للعرض</a>
                <button class="copy-btn" id="copyViewLink">📋 نسخ الرابط</button>
            </div>
        </div>

        <div class="output-box">
            <span class="label">📦 رابط Firebase الخام (للاستخدام الداخلي)</span>
            <div class="link-row">
                <span id="rawLink" style="color:#aaa; font-size:13px; word-break:break-all;"></span>
                <button class="copy-btn" id="copyRawLink">📋 نسخ</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <span>⚡ حماية SZ · جميع الحقوق محفوظة</span>
    </div>
</div>

<script>
    // ============================================================
    // FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {
        databaseURL: "https://sz-chat-1306e-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ============================================================
    // DOM REFS
    // ============================================================
    const scriptInput = document.getElementById('scriptInput');
    const encryptBtn = document.getElementById('encryptBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusEl = document.getElementById('status');
    const resultArea = document.getElementById('resultArea');
    const robloxScript = document.getElementById('robloxScript');
    const viewLink = document.getElementById('viewLink');
    const rawLink = document.getElementById('rawLink');
    const copyRobloxBtn = document.getElementById('copyRobloxBtn');
    const copyViewLink = document.getElementById('copyViewLink');
    const copyRawLink = document.getElementById('copyRawLink');

    // ============================================================
    // UTILITIES
    // ============================================================
    function generateKey(length = 8) {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let result = '';
        for (let i = 0; i < length; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }

    function showStatus(message, type = 'info') {
        statusEl.textContent = message;
        statusEl.className = 'status ' + type;
        statusEl.style.display = 'block';
    }

    function hideStatus() {
        statusEl.style.display = 'none';
    }

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(textarea);
    }

    // ============================================================
    // MAIN ENCRYPT / UPLOAD
    // ============================================================
    encryptBtn.addEventListener('click', async function() {
        const script = scriptInput.value.trim();
        if (!script) {
            showStatus('❌ يرجى كتابة السكربت أولاً!', 'error');
            return;
        }

        encryptBtn.disabled = true;
        encryptBtn.textContent = '⏳ جاري الرفع...';
        hideStatus();

        try {
            // 1. Generate unique key
            let key = generateKey(8);
            let exists = true;
            while (exists) {
                const snap = await db.ref('scripts/' + key).once('value');
                if (!snap.exists()) {
                    exists = false;
                } else {
                    key = generateKey(8);
                }
            }

            // 2. Store script in Firebase
            await db.ref('scripts/' + key).set({
                code: script,
                createdAt: Date.now(),
                protected: true
            });

            // 3. Build links
            const firebaseRaw = `https://sz-chat-1306e-default-rtdb.firebaseio.com/scripts/${key}.json`;
            const viewUrl = `https://abasameerz15-tech.github.io/AppUpdates/view.html?key=${key}`;

            // 4. Build Roblox loadstring script
            const loadstringScript = `loadstring((function() local d=game:GetService("HttpService"):JSONDecode(game:HttpGet("${firebaseRaw}")); return d.code end)())()`;

            // 5. Display results
            robloxScript.textContent = loadstringScript;
            viewLink.href = viewUrl;
            viewLink.textContent = viewUrl;
            rawLink.textContent = firebaseRaw;

            resultArea.style.display = 'block';
            showStatus('✅ تم رفع السكربت وحمايته بنجاح!', 'success');

        } catch (err) {
            showStatus('❌ فشل الرفع: ' + err.message, 'error');
        } finally {
            encryptBtn.disabled = false;
            encryptBtn.textContent = '🚀 تشفير ورفع';
        }
    });

    // ============================================================
    // CLEAR
    // ============================================================
    clearBtn.addEventListener('click', function() {
        scriptInput.value = '';
        hideStatus();
        resultArea.style.display = 'none';
    });

    // ============================================================
    // COPY BUTTONS
    // ============================================================
    copyRobloxBtn.addEventListener('click', function() {
        copyToClipboard(robloxScript.textContent);
        showStatus('✅ تم نسخ سكربت loadstring!', 'success');
        setTimeout(hideStatus, 2000);
    });

    copyViewLink.addEventListener('click', function() {
        copyToClipboard(viewLink.href);
        showStatus('✅ تم نسخ رابط العرض!', 'success');
        setTimeout(hideStatus, 2000);
    });

    copyRawLink.addEventListener('click', function() {
        copyToClipboard(rawLink.textContent);
        showStatus('✅ تم نسخ الرابط الخام!', 'success');
        setTimeout(hideStatus, 2000);
    });

    // ============================================================
    // KEYBOARD SHORTCUT: Ctrl+Enter to encrypt
    // ============================================================
    scriptInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            encryptBtn.click();
        }
    });

    // ============================================================
    // INIT
    // ============================================================
    console.log('🔐 SZ Encrypter جاهز');
</script>

</body>
</html>
