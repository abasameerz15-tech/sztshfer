<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استوديو إزالة الخلفية الخضراء</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      max-width: 800px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 12px;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 1rem;
      margin-bottom: 30px;
    }

    .upload-btn {
      display: inline-block;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .upload-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
    }

    input[type="file"] {
      display: none;
    }

    .video-container {
      margin-top: 30px;
      position: relative;
      display: none;
      border-radius: 16px;
      overflow: hidden;
      background: repeating-conic-gradient(#1e293b 0% 25%, #0f172a 0% 50%) 50% / 20px 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
    }

    video {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>أهلاً بك في استوديو إزالة الخلفية 🎬</h1>
    <p class="subtitle">قم برفع فيديو يتضمن خلفية خضراء ليتم تفريغها فورياً وبشكل احترافي.</p>

    <label class="upload-btn" for="videoInput">
      📁 رفع فيديو
    </label>
    <input type="file" id="videoInput" accept="video/*">

    <div class="video-container" id="videoContainer">
      <canvas id="outputCanvas"></canvas>
    </div>

    <video id="inputVideo" loop playsinline muted></video>
  </div>

  <script>
    const videoInput = document.getElementById('videoInput');
    const inputVideo = document.getElementById('inputVideo');
    const outputCanvas = document.getElementById('outputCanvas');
    const ctx = outputCanvas.getContext('2d', { willReadFrequently: true });
    const videoContainer = document.getElementById('videoContainer');

    videoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        inputVideo.src = fileURL;
        inputVideo.play();
        videoContainer.style.display = 'block';
      }
    });

    inputVideo.addEventListener('play', () => {
      outputCanvas.width = inputVideo.videoWidth;
      outputCanvas.height = inputVideo.videoHeight;
      processFrame();
    });

    function processFrame() {
      if (inputVideo.paused || inputVideo.ended) return;

      ctx.drawImage(inputVideo, 0, 0, outputCanvas.width, outputCanvas.height);
      const frame = ctx.getImageData(0, 0, outputCanvas.width, outputCanvas.height);
      const l = frame.data.length / 4;

      for (let i = 0; i < l; i++) {
        const r = frame.data[i * 4 + 0];
        const g = frame.data[i * 4 + 1];
        const b = frame.data[i * 4 + 2];

        // اكتشاف الدرجة الخضراء وتفريغ الشفافية (Alpha)
        if (g > 90 && r < 100 && b < 100) {
          frame.data[i * 4 + 3] = 0;
        }
      }

      ctx.putImageData(frame, 0, 0);
      requestAnimationFrame(processFrame);
    }
  </script>

</body>
</html>
